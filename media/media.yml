# Items on the Media page, newest first within each language.
#
# Fields (leave a field empty, "", and it is simply not shown):
#   language:    en  -> listed under "In English"
#                th  -> listed under "ภาษาไทย · In Thai"
#   year:        shown in the left column
#   title:       the headline as published; it links to url. An item with an
#                empty title is not shown at all.
#   translation: for a Thai item, the title in English (shown in italics)
#   kind:        what it is, e.g. "Interview"; shown before the outlet
#   outlet:      where it appeared, e.g. "Dek-D"
#   note:        an optional short line underneath
#   url:         the full web address
#   keep-whole:  words in the title that must never be split at the end of a
#                line, separated by commas, e.g. "จิมมี่, สถานทูต". Browsers
#                split Thai text into words by themselves and sometimes cut a
#                word they do not know, such as a name.
# Markdown works in every field, e.g. *italics*.

